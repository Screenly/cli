---
name: Generate SBOMs

on:
  push:
    tags:
      - 'v*'

jobs:
  sbom:
    permissions:
      id-token: write
      contents: read
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload SBOM
        # Image digest, not a repo ref: the action's action.yml runs
        # ghcr.io/sbomify/sbomify-action:latest, so even a commit-SHA pin
        # would execute whatever image :latest points to at run time.
        uses: docker://ghcr.io/sbomify/sbomify-action@sha256:376e319b46134efc0b158bb5eae76a8a6b988864fd6b0a02d506ca798a238d48 # 26.11.0
        env:
          TOKEN: ${{ secrets.SBOMIFY_TOKEN }}
          COMPONENT_ID: 'UUzAdk8ixV'
          LOCK_FILE: 'Cargo.lock'
          SBOM_VERSION: ${{ github.ref_name }}
          OUTPUT_FILE: 'cli.cdx.json'
          OVERRIDE_NAME: true
          AUGMENT: true
          ENRICH: true

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: '${{ github.workspace }}/cli.cdx.json'
