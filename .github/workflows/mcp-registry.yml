# Publishes the release's MCP Bundles (.mcpb) to the official MCP Registry
# (registry.modelcontextprotocol.io), which GitHub's MCP directory reads from.
#
# Runs automatically after a tagged release (called from release.yml), and can be
# run by hand from the Actions tab to (re)publish an existing release tag.
#
# Auth is GitHub OIDC: the registry trusts tokens from this repository for the
# io.github.Screenly/* namespace, so no secret or org Owner is needed.

name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v26.11.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v26.11.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to the MCP Registry
    env:
      TAG: ${{ inputs.tag }}
      MCP_PUBLISHER_VERSION: v1.8.9
      GH_TOKEN: ${{ github.token }}
    steps:
      # Checks out the ref the workflow runs on (the tag on release, or the chosen
      # branch on a manual run), so older tags without mcpb/server.json still work.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server.json for this release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be semver like v1.2.3, got: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Must match the mcpb_alias values in release.yml.
          aliases=(macos-arm64 macos-x64 windows-x64)

          mkdir -p dist
          for alias in "${aliases[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir dist --pattern "screenly-${alias}.mcpb"
          done

          packages='[]'
          for alias in "${aliases[@]}"; do
            file="screenly-${alias}.mcpb"
            sha="$(sha256sum "dist/${file}" | cut -d' ' -f1)"
            packages="$(jq -c --arg id "${base}/${file}" --arg sha "$sha" \
              '. + [{registryType: "mcpb", identifier: $id, fileSha256: $sha, transport: {type: "stdio"}}]' \
              <<<"$packages")"
          done

          jq --arg version "$version" --argjson packages "$packages" \
            '.version = $version | .packages = $packages' \
            mcpb/server.json > server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
